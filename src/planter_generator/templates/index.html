<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planter Sleeve Generator</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #fafbfc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --button: #1e293b;
      --button-text: #ffffff;
      --input-bg: #f8fafc;
      --input-ink: #0f172a;
      --input-border: #cbd5e1;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      --panel-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      --accent: #3b82f6;
      --accent-light: #dbeafe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #f7f9fb 0%, #eceff4 45%, #eef2f7 100%);
    }
    .card {
      width: 100vw;
      height: 100vh;
      margin: 0;
      background: var(--bg);
      border: 0;
      border-radius: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      animation: rise 360ms ease-out;
    }
    @keyframes rise {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    header {
      background: transparent;
      color: var(--ink);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid rgba(222, 227, 233, 0.9);
    }
    .header-copy {
      min-width: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
      font-weight: 800;
      line-height: 1.1;
    }
    header p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.2;
    }
    .content {
      padding: 14px 18px 20px;
      height: 100%;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.45fr);
      gap: 20px;
      align-items: stretch;
      height: 100%;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--panel-shadow);
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 700;
    }
    .error {
      background: #f8e9e3;
      color: #8e2a1b;
      border: 1px solid #f1c4b6;
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
    }
    input, select {
      border: 1px solid var(--input-border);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 0.95rem;
      background: var(--input-bg);
      color: var(--input-ink);
      transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #a5b0c3;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(162, 175, 193, 0.12);
    }
    .actions {
      margin-top: auto;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .header-actions button {
      padding: 8px 12px;
      border-radius: 13px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 16px rgba(35, 42, 57, 0.15);
    }
    button {
      border: none;
      border-radius: 16px;
      padding: 14px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--button-text);
      background: linear-gradient(135deg, #3c4450 0%, #252b37 100%);
      box-shadow: 0 12px 22px rgba(35, 42, 57, 0.16);
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(35, 42, 57, 0.2);
    }
    .button-secondary {
      color: #2e3846;
      background: linear-gradient(135deg, #eff3f8 0%, #dfe7f1 100%);
      box-shadow: 0 10px 18px rgba(94, 116, 145, 0.18);
    }
    .muted {
      align-self: center;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .preview-wrap {
      height: 100%;
      min-height: 620px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: #f5f7fb;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
    }
    #preview-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #f8fafc 0%, #e9eef5 100%);
    }
    .preview-meta {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .preview-panel {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 0;
    }
    .menu-panel {
      overflow-y: auto;
      height: 100%;
      max-height: calc(100vh - 112px);
      padding-right: 6px;
    }
    .section-heading {
      border-top: 1px solid #e8ebf0;
      padding-top: 18px;
      margin-top: 18px;
    }
    .section-heading h3 {
      margin: 0 0 12px;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #47515f;
    }
    .preview-error {
      color: #7a2a14;
      font-size: 0.88rem;
      min-height: 1.2em;
      margin-top: 8px;
    }
    .toggle-label {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
    }
    .toggle-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #334155;
    }
    .toggle-caption {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 500;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .menu-panel { max-height: 46vh; }
      .preview-wrap { min-height: 60vh; }
    }
    @media (max-width: 780px) {
      header { flex-direction: column; align-items: flex-start; gap: 10px; }
      header h1 { font-size: 1.45rem; }
      header p { font-size: 0.92rem; }
      .header-actions { width: 100%; justify-content: flex-start; }
      .content { padding: 16px 18px 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <div class="header-copy">
        <h1>Planter Sleeve Generator</h1>
        <p>Browser UI for generating 3D-printable planter sleeves in STL and 3MF.</p>
      </div>
      <div class="header-actions">
        <button type="submit" form="generator-form" formaction="/generate" formmethod="post" name="format" value="stl">Export STL</button>
        <button type="submit" form="generator-form" formaction="/generate" formmethod="post" name="format" value="3mf">Export 3MF</button>
        <button type="submit" form="generator-form" formaction="/save-config" formmethod="post" class="button-secondary">Save JSON</button>
      </div>
    </header>

    <section class="content">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <div class="layout">
        <aside class="panel preview-panel">
          <div class="preview-wrap">
            <canvas id="preview-canvas"></canvas>
          </div>
          <div id="preview-error" class="preview-error"></div>
        </aside>

        <form id="generator-form" method="post" action="/generate" class="panel menu-panel">
          <div class="grid">
            <label>
              Pot diameter (mm)
              <input name="pot_diameter" type="number" step="0.1" min="1" value="{{ values.pot_diameter }}" required>
            </label>
            <label>
              Clearance (mm)
              <input name="clearance" type="number" step="0.1" value="{{ values.clearance }}" required>
            </label>
            <label>
              Height (mm)
              <input name="height" type="number" step="0.1" min="1" value="{{ values.height }}" required>
            </label>
            <label>
              Wall thickness (mm)
              <input name="wall" type="number" step="0.1" min="0.2" value="{{ values.wall }}" required>
            </label>
            <label>
              Base thickness (mm)
              <input name="base" type="number" step="0.1" min="0.2" value="{{ values.base }}" required>
            </label>
            <label class="toggle-label">
              <input name="include_bottom" type="checkbox" {% if values.include_bottom %}checked{% endif %}>
              Include bottom
            </label>
            <div class="toggle-caption">Enabled by default. Disable for an open-bottom sleeve.</div>
            <label>
              Taper (deg)
              <input name="taper" type="number" step="0.1" value="{{ values.taper }}" required>
            </label>
            <label>
              Rim lip (mm)
              <input name="rim_lip" type="number" step="0.1" min="0" value="{{ values.rim_lip }}" required>
            </label>
            <label>
              Shape type
              <select name="shape_type" required>
                <option value="polygon" {% if values.shape_type == "polygon" %}selected{% endif %}>Polygon (n-sided)</option>
                <option value="star" {% if values.shape_type == "star" %}selected{% endif %}>Star</option>
              </select>
            </label>
            <label>
              Star inner ratio (0.1–0.9)
              <input name="star_inner_ratio" type="number" step="0.05" min="0.1" max="0.9" value="{{ values.star_inner_ratio }}" required>
            </label>
            <div class="section-heading texture-section"><h3>Texture controls</h3></div>
            <label class="texture-section">
              Texture type
              <select name="texture_type" required>
                <optgroup label="Flat">
                  <option value="none" {% if values.texture_type == "none" %}selected{% endif %}>None</option>
                </optgroup>
                <optgroup label="Linear">
                  <option value="rings" {% if values.texture_type == "rings" %}selected{% endif %}>Rings</option>
                  <option value="micro_rings" {% if values.texture_type == "micro_rings" %}selected{% endif %}>Micro Rings</option>
                  <option value="spiral" {% if values.texture_type == "spiral" %}selected{% endif %}>Spiral</option>
                  <option value="braid" {% if values.texture_type == "braid" %}selected{% endif %}>Braid</option>
                </optgroup>
                <optgroup label="Patterned">
                  <option value="grid" {% if values.texture_type == "grid" %}selected{% endif %}>Grid</option>
                  <option value="hex" {% if values.texture_type == "hex" %}selected{% endif %}>Hex Cell</option>
                  <option value="hammered" {% if values.texture_type == "hammered" %}selected{% endif %}>Hammered</option>
                </optgroup>
              </select>
            </label>
            <label class="texture-section">
              Texture strength (mm)
              <input name="texture_strength" type="number" step="0.1" min="0" max="5" value="{{ values.texture_strength }}" required>
            </label>
            <label class="texture-section">
              Texture scale
              <input name="texture_scale" type="number" step="0.1" min="0.5" max="8" value="{{ values.texture_scale }}" required>
            </label>
            <label class="texture-section">
              Texture rotation (deg)
              <input name="texture_rotation" type="number" step="1" min="0" max="360" value="{{ values.texture_rotation }}" required>
            </label>
            <label class="texture-section">
              Middle inbound (0-50)
              <input name="middle_inbound_turns" type="number" step="0.1" min="0" max="50" value="{{ values.middle_inbound_turns or values.twist_turns or '0' }}" required>
            </label>
            <label class="texture-section">
              Z twist at top (deg)
              <input name="z_rotation" type="number" step="1" min="-3600" max="3600" value="{{ values.z_rotation or '0' }}" required>
            </label>
            <label>
              Material style
              <select name="material_type" required>
                <optgroup label="Stone & Concrete">
                  <option value="concrete">Light concrete</option>
                  <option value="dark-stone">Dark stone</option>
                  <option value="sandstone">Sandstone</option>
                  <option value="slate">Slate finish</option>
                  <option value="terrazzo">Terrazzo</option>
                  <option value="basalt">Basalt</option>
                  <option value="weathered-concrete">Weathered concrete</option>
                </optgroup>
                <optgroup label="Ceramic & Clay">
                  <option value="glossy-ceramic">Glossy ceramic</option>
                  <option value="pearl-glaze">Pearl glaze</option>
                  <option value="porcelain-speckle">Porcelain speckle</option>
                  <option value="terracotta">Terracotta</option>
                  <option value="raku">Raku crackle</option>
                </optgroup>
                <optgroup label="Metal & Industrial">
                  <option value="brushed-metal">Brushed metal</option>
                  <option value="oxidized-copper">Oxidized copper</option>
                  <option value="worn-steel">Worn steel</option>
                  <option value="matte-black">Matte black</option>
                  <option value="charcoal">Charcoal</option>
                </optgroup>
                <optgroup label="Natural & Composite">
                  <option value="smooth-sand">Smooth sand</option>
                  <option value="travertine">Travertine</option>
                  <option value="micro-cement">Micro cement</option>
                </optgroup>
              </select>
            </label>
            <label>
              Mesh sections
              <input name="sections" type="number" step="1" min="24" value="{{ values.sections }}" required>
            </label>
        </div>

          <div class="actions">
            <span class="muted">Use top-right buttons next to the title to export STL/3MF or save JSON.</span>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById("preview-canvas");
    const previewError = document.getElementById("preview-error");
    const form = document.querySelector("form[action='/generate']");
    const inputNames = [
      "pot_diameter", "clearance", "height", "wall", "base", "taper", "rim_lip",
      "include_bottom", "shape_type", "star_inner_ratio", "texture_type", "texture_strength", "texture_scale", "texture_rotation", "middle_inbound_turns", "z_rotation", "material_type", "sections"
    ];
    const inputs = Object.fromEntries(inputNames.map((name) => [name, form.querySelector(`[name='${name}']`)]));

    console.log("Form loaded:", form ? "✓" : "✗");
    console.log("Canvas loaded:", canvas ? "✓" : "✗");
    console.log("Input fields loaded:", Object.keys(inputs).filter(k => inputs[k]).length, "/", inputNames.length);
    console.log("shape_type field:", inputs.shape_type ? "✓" : "✗");
    console.log("star_inner_ratio field:", inputs.star_inner_ratio ? "✓" : "✗");
    let hasAutoFramedModel = false;

    function numberValue(name) {
      try {
        const field = inputs[name];
        if (!field) {
          console.warn(`Field not found: ${name}`);
          return 0;
        }
        const value = Number(field.value);
        if (!Number.isFinite(value)) {
          throw new Error(`${name} is invalid`);
        }
        return value;
      } catch (error) {
        console.error(`Error parsing ${name}:`, error);
        throw error;
      }
    }

    function textureOffset(z, theta) {
      const type = inputs.texture_type.value;
      const strength = numberValue("texture_strength");
      const scale = Math.max(0.1, numberValue("texture_scale"));
      const rotation = (numberValue("texture_rotation") * Math.PI) / 180.0;
      const phase = rotation;
      const zRatio = z / Math.max(1e-6, numberValue("height"));
      const frequency = Math.max(1, scale);
      const zAngle = Math.PI * 2.0 * frequency * zRatio;
      const thetaAngle = (frequency * theta) + phase;

      if (type === "rings") {
        const base =
          Math.sin(zAngle + phase)
          + 0.38 * Math.sin((3.0 * zAngle) + (phase * 0.6))
          + 0.2 * Math.sin((7.0 * zAngle) - (phase * 0.35));
        return strength * 0.62 * base;
      }
      if (type === "micro_rings") {
        const base =
          Math.sin((2.0 * zAngle) + phase)
          + 0.52 * Math.sin((8.0 * zAngle) + (phase * 0.5))
          + 0.18 * Math.sin((16.0 * zAngle) - (phase * 0.25));
        return strength * 0.48 * base;
      }
      if (type === "spiral") {
        const base = Math.sin(thetaAngle + zAngle);
        const detail = 0.26 * Math.sin((2.6 * thetaAngle) - (3.2 * zAngle));
        return strength * (base + detail);
      }
      if (type === "braid") {
        const left = Math.sin(thetaAngle + (1.5 * zAngle));
        const right = Math.sin((-thetaAngle) + (1.5 * zAngle) + (Math.PI * 0.5));
        const weave = 0.45 * Math.sin((4.0 * thetaAngle) + (0.7 * zAngle));
        return strength * 0.68 * (left * right + weave);
      }
      if (type === "grid") {
        const coarse = Math.sin(thetaAngle) * Math.sin(zAngle + phase);
        const fine =
          0.35
          * Math.sin((3.0 * thetaAngle) + phase)
          * Math.sin((3.0 * zAngle) - phase);
        return strength * 0.52 * (coarse + fine);
      }
      if (type === "hex") {
        const a = Math.abs(Math.sin(thetaAngle));
        const b = Math.abs(Math.sin((0.58 * thetaAngle) + (1.72 * zAngle)));
        const c = Math.abs(Math.sin((0.58 * thetaAngle) - (1.72 * zAngle)));
        return strength * (((a + b + c) / 3.0) - 0.5);
      }
      if (type === "hammered") {
        const n1 = Math.sin((7.0 * thetaAngle) + (5.0 * zAngle));
        const n2 = Math.sin((13.0 * thetaAngle) - (11.0 * zAngle) + 1.7);
        const n3 = Math.sin((17.0 * thetaAngle) + (3.0 * zAngle) - 0.9);
        const noise = (n1 + n2 + n3) / 3.0;
        return strength * 0.55 * noise;
      }
      return 0;
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function createAxisLabelSprite(letter, tintColor) {
      const width = 320;
      const height = 160;
      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = width;
      labelCanvas.height = height;
      const ctx = labelCanvas.getContext("2d");
      ctx.clearRect(0, 0, width, height);

      ctx.shadowColor = "rgba(15, 23, 42, 0.16)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;
      drawRoundedRect(ctx, 16, 16, width - 32, height - 32, 30);
      const cardGradient = ctx.createLinearGradient(0, 16, 0, height - 16);
      cardGradient.addColorStop(0, "rgba(255, 255, 255, 0.93)");
      cardGradient.addColorStop(1, "rgba(243, 247, 252, 0.88)");
      ctx.fillStyle = cardGradient;
      ctx.fill();

      ctx.shadowColor = "rgba(0, 0, 0, 0)";
      drawRoundedRect(ctx, 16, 16, width - 32, height - 32, 30);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.45)";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = tintColor;
      ctx.font = "700 50px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(letter, width / 2, height / 2);

      const tex = new THREE.CanvasTexture(labelCanvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthTest: false,
        depthWrite: false,
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(82, 41, 1);
      return sprite;
    }

    function addAxisHelpers() {
      const axisLength = 240;
      const axes = new THREE.AxesHelper(axisLength);
      scene.add(axes);

      const xLabel = createAxisLabelSprite("X", "#be123c");
      xLabel.position.set(axisLength + 44, 0, 0);
      scene.add(xLabel);

      const yLabel = createAxisLabelSprite("Y", "#15803d");
      yLabel.position.set(0, axisLength + 44, 0);
      scene.add(yLabel);

      const zLabel = createAxisLabelSprite("Z", "#1d4ed8");
      zLabel.position.set(0, 0, axisLength + 44);
      scene.add(zLabel);
    }

    function buildProfile() {
      const includeBottom = !!inputs.include_bottom?.checked;
      const pot = numberValue("pot_diameter");
      const clearance = numberValue("clearance");
      const height = numberValue("height");
      const wall = numberValue("wall");
      const base = numberValue("base");
      const taperDeg = numberValue("taper");
      const rimLip = numberValue("rim_lip");

      const innerDiameter = pot + (2.0 * clearance);
      const taper = Math.tan((taperDeg * Math.PI) / 180.0);
      const zBase = includeBottom ? base : 0.0;
      const zTop = height;
      const zLip = Math.max(zBase, zTop - wall);
      const rInnerAtBase = innerDiameter / 2.0;

      const rInner = (z) => rInnerAtBase + (taper * (z - zBase));
      const rOuter = (z) => rInner(z) + wall;

      const rO0 = rOuter(0.0);
      const rOb = rOuter(zBase);
      const rOl = rOuter(zLip);
      const rOt = rOuter(zTop);
      const rIt = rInner(zTop);
      const rLt = rOt + rimLip;
      const rLl = rOl + rimLip;

      const radii = [rO0, rOb, rOl, rOt, rIt, rLt, rLl, rInnerAtBase];
      if (radii.some((r) => r <= 0) || wall <= 0 || height <= zBase) {
        throw new Error("Invalid dimensions for preview.");
      }

      if (includeBottom && base <= 0) {
        throw new Error("Base thickness must be > 0 when bottom is enabled.");
      }

      if (!includeBottom) {
        return [
          [rOb, zBase],
          [rOl, zLip],
          [rLl, zLip],
          [rLt, zTop],
          [rIt, zTop],
          [rInnerAtBase, zBase],
        ];
      }

      return [
        [rO0, 0.0],
        [rOb, zBase],
        [rOl, zLip],
        [rLl, zLip],
        [rLt, zTop],
        [rIt, zTop],
        [rInnerAtBase, zBase],
      ];
    }

    function buildGeometry() {
      const sections = Math.max(24, Math.floor(numberValue("sections")));
      const shapeType = inputs.shape_type?.value || "polygon";
      const starInnerRatio = shapeType === "star" ? Math.max(0.1, Math.min(0.9, numberValue("star_inner_ratio"))) : 1.0;
      const pointCount = shapeType === "star" ? sections * 2 : sections;
      const profile = buildProfile();
      const includeBottom = !!inputs.include_bottom?.checked;
      const base = numberValue("base");
      const middleInboundTurns = Math.max(0, Math.min(50, numberValue("middle_inbound_turns")));
      const zRotationDeg = numberValue("z_rotation");
      const height = Math.max(1e-6, numberValue("height"));
      const vertices = [];
      const uvs = [];
      const indices = [];

      console.log(`[buildGeometry] shape=${shapeType}, sections=${sections}, pointCount=${pointCount}, profile.length=${profile.length}`);

      for (let i = 0; i < profile.length; i++) {
        const [radius, z] = profile[i];
        const zRatio = z / height;
        const rotationAtZ = (Math.PI * 2.0) * middleInboundTurns * zRatio;
        const zTwistAtZ = ((zRotationDeg * Math.PI) / 180.0) * zRatio;
        for (let j = 0; j < pointCount; j++) {
          let theta, radiusFactor;
          if (shapeType === "star") {
            const totalPoints = sections * 2;
            theta = (j / totalPoints) * Math.PI * 2.0;
            radiusFactor = (j % 2) === 1 ? starInnerRatio : 1.0;
          } else {
            theta = (j / sections) * Math.PI * 2.0;
            radiusFactor = 1.0;
          }
          const offset = textureOffset(z, theta);
          const r = Math.max(0.025, (radius + offset) * radiusFactor);
          const thetaRotated = theta + rotationAtZ + zTwistAtZ;
          vertices.push(r * Math.cos(thetaRotated), r * Math.sin(thetaRotated), z);
          uvs.push(j / pointCount, z / numberValue("height"));
        }
      }

      console.log(`[buildGeometry] vertices=${vertices.length}, profile rings=${profile.length}`);

      for (let i = 0; i < profile.length - 1; i++) {
        for (let j = 0; j < pointCount; j++) {
          const a = i * pointCount + j;
          const b = i * pointCount + ((j + 1) % pointCount);
          const c = (i + 1) * pointCount + ((j + 1) % pointCount);
          const d = (i + 1) * pointCount + j;
          indices.push(a, b, c, a, c, d);
        }
      }

      if (includeBottom && base > 0 && profile.length >= 7) {
        const centerIndex = vertices.length / 3;
        vertices.push(0, 0, 0);
        uvs.push(0.5, 0.5);

        for (let j = 0; j < pointCount; j++) {
          const a = j;
          const b = (j + 1) % pointCount;
          indices.push(centerIndex, b, a);
        }

        const outerBaseRing = 1;
        const innerBaseRing = profile.length - 1;
        const outerStart = outerBaseRing * pointCount;
        const innerStart = innerBaseRing * pointCount;
        for (let j = 0; j < pointCount; j++) {
          const a = outerStart + j;
          const b = outerStart + ((j + 1) % pointCount);
          const c = innerStart + ((j + 1) % pointCount);
          const d = innerStart + j;
          indices.push(a, b, c, a, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function generateTexture(type) {
      const size = 1024;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, size, size);

      function rand(min, max) {
        return min + (Math.random() * (max - min));
      }

      function drawSpeckles(count, maxRadius, alphaMin, alphaMax, tone = 255) {
        for (let i = 0; i < count; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const radius = Math.random() * maxRadius;
          const alpha = rand(alphaMin, alphaMax);
          ctx.fillStyle = `rgba(${tone},${tone},${tone},${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawFibers(count, alphaMax, width = 1.0) {
        for (let i = 0; i < count; i++) {
          const y = Math.random() * size;
          ctx.strokeStyle = `rgba(255,255,255,${Math.random() * alphaMax})`;
          ctx.lineWidth = width;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(size, y + rand(-6, 6));
          ctx.stroke();
        }
      }

      function drawMicroNoise(count, dark = false) {
        for (let i = 0; i < count; i++) {
          const x = Math.floor(Math.random() * size);
          const y = Math.floor(Math.random() * size);
          const alpha = dark ? rand(0.03, 0.11) : rand(0.025, 0.09);
          if (dark) {
            ctx.fillStyle = `rgba(16, 20, 28, ${alpha})`;
          } else {
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          }
          const s = Math.random() < 0.85 ? 1 : 2;
          ctx.fillRect(x, y, s, s);
        }
      }

      const styles = {
        concrete: { base: "#b8bbc0", accent: "rgba(255,255,255,0.12)", noise: 0.04 },
        "dark-stone": { base: "#4f545d", accent: "rgba(255,255,255,0.08)", noise: 0.08 },
        "glossy-ceramic": { base: "#ece9e3", accent: "rgba(255,255,255,0.4)", noise: 0.02 },
        "brushed-metal": { base: "#adb4bb", accent: "rgba(255,255,255,0.22)", noise: 0.03 },
        "matte-black": { base: "#22252a", accent: "rgba(255,255,255,0.05)", noise: 0.04 },
        sandstone: { base: "#d6c4a8", accent: "rgba(255,255,255,0.18)", noise: 0.06 },
        slate: { base: "#8a92a0", accent: "rgba(255,255,255,0.12)", noise: 0.03 },
        "pearl-glaze": { base: "#f1ece5", accent: "rgba(255,255,255,0.45)", noise: 0.02 },
        charcoal: { base: "#363940", accent: "rgba(255,255,255,0.08)", noise: 0.06 },
        "smooth-sand": { base: "#cbc1b0", accent: "rgba(255,255,255,0.16)", noise: 0.05 },
        terrazzo: { base: "#d8d9d4", accent: "rgba(255,255,255,0.18)", noise: 0.03 },
        basalt: { base: "#565e67", accent: "rgba(255,255,255,0.08)", noise: 0.08 },
        "weathered-concrete": { base: "#a8adb3", accent: "rgba(255,255,255,0.1)", noise: 0.07 },
        "porcelain-speckle": { base: "#f0eee8", accent: "rgba(255,255,255,0.4)", noise: 0.015 },
        terracotta: { base: "#b8674a", accent: "rgba(255,255,255,0.1)", noise: 0.045 },
        raku: { base: "#2f3238", accent: "rgba(255,255,255,0.22)", noise: 0.04 },
        "oxidized-copper": { base: "#6c7f74", accent: "rgba(255,255,255,0.18)", noise: 0.05 },
        "worn-steel": { base: "#7d858f", accent: "rgba(255,255,255,0.14)", noise: 0.04 },
        travertine: { base: "#d7c6a7", accent: "rgba(255,255,255,0.14)", noise: 0.04 },
        "micro-cement": { base: "#c2c6cc", accent: "rgba(255,255,255,0.12)", noise: 0.03 },
      };

      const style = styles[type] || styles.concrete;
      ctx.fillStyle = style.base;
      ctx.fillRect(0, 0, size, size);

      drawSpeckles(2200, style.noise * size, 0.01, 0.08);
      drawMicroNoise(9500, false);
      drawMicroNoise(6800, true);

      if (type === "brushed-metal") {
        drawFibers(120, 0.12, 1.1);
      }

      if (type === "glossy-ceramic" || type === "pearl-glaze") {
        const gradient = ctx.createRadialGradient(size * 0.3, size * 0.2, 0, size * 0.3, size * 0.2, size * 0.8);
        gradient.addColorStop(0, "rgba(255,255,255,0.35)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        drawMicroNoise(3500, false);
      }

      if (type === "matte-black" || type === "charcoal") {
        drawFibers(70, 0.04, 1);
      }

      if (type === "terrazzo") {
        const chips = ["#ffffff", "#d0cdc6", "#8f969f", "#c4a88a", "#6f7680"];
        for (let i = 0; i < 260; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const r = rand(2, 10);
          ctx.fillStyle = chips[Math.floor(Math.random() * chips.length)];
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          for (let p = 0; p < 6; p++) {
            const angle = (p / 6) * Math.PI * 2 + rand(-0.3, 0.3);
            const rr = r * rand(0.5, 1.2);
            ctx.lineTo(x + Math.cos(angle) * rr, y + Math.sin(angle) * rr);
          }
          ctx.closePath();
          ctx.fill();
        }
      }

      if (type === "basalt") {
        for (let i = 0; i < 1400; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const radius = rand(0.4, 2.3);
          ctx.fillStyle = `rgba(20,24,28,${rand(0.08, 0.24)})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (type === "weathered-concrete" || type === "micro-cement") {
        for (let i = 0; i < 44; i++) {
          ctx.strokeStyle = `rgba(255,255,255,${rand(0.02, 0.07)})`;
          ctx.lineWidth = rand(0.8, 2.2);
          const y0 = rand(0, size);
          ctx.beginPath();
          ctx.moveTo(0, y0);
          ctx.bezierCurveTo(size * 0.3, y0 + rand(-18, 18), size * 0.7, y0 + rand(-18, 18), size, y0 + rand(-12, 12));
          ctx.stroke();
        }
      }

      if (type === "porcelain-speckle") {
        drawSpeckles(1400, 1.8, 0.03, 0.12, 42);
      }

      if (type === "terracotta") {
        drawFibers(65, 0.035, 0.8);
        drawSpeckles(900, 2.4, 0.02, 0.08, 66);
      }

      if (type === "raku") {
        ctx.strokeStyle = "rgba(255,255,255,0.28)";
        ctx.lineWidth = 1.1;
        for (let i = 0; i < 150; i++) {
          const x0 = rand(0, size);
          const y0 = rand(0, size);
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x0 + rand(-32, 32), y0 + rand(-32, 32));
          ctx.stroke();
        }
        drawMicroNoise(5200, true);
      }

      if (type === "oxidized-copper") {
        const patina = ctx.createLinearGradient(0, 0, size, size);
        patina.addColorStop(0, "rgba(91, 146, 128, 0.35)");
        patina.addColorStop(1, "rgba(46, 88, 86, 0.16)");
        ctx.fillStyle = patina;
        ctx.fillRect(0, 0, size, size);
        drawFibers(90, 0.06, 0.9);
      }

      if (type === "worn-steel") {
        drawFibers(130, 0.12, 0.9);
        drawSpeckles(600, 2.2, 0.04, 0.1, 230);
      }

      if (type === "travertine") {
        for (let i = 0; i < 95; i++) {
          const y = rand(0, size);
          const h = rand(2, 7);
          ctx.fillStyle = `rgba(132, 108, 78, ${rand(0.08, 0.18)})`;
          ctx.fillRect(0, y, size, h);
        }
        drawSpeckles(1100, 2.0, 0.01, 0.07, 245);
      }

      if (type === "micro-cement" || type === "weathered-concrete" || type === "basalt") {
        drawMicroNoise(7800, true);
      }

      return new THREE.CanvasTexture(canvas);
    }

    function createMaterial() {
      const type = inputs.material_type.value;
      const presets = {
        concrete: { color: 0xb8bcc0, roughness: 0.82, metalness: 0.05, bumpScale: 0.09 },
        "dark-stone": { color: 0x4f545d, roughness: 0.88, metalness: 0.04, bumpScale: 0.12 },
        "glossy-ceramic": { color: 0xece9e3, roughness: 0.22, metalness: 0.05, bumpScale: 0.02 },
        "brushed-metal": { color: 0xadb4bb, roughness: 0.35, metalness: 0.85, bumpScale: 0.08 },
        "matte-black": { color: 0x22252a, roughness: 0.93, metalness: 0.03, bumpScale: 0.06 },
        sandstone: { color: 0xd6c4a8, roughness: 0.82, metalness: 0.02, bumpScale: 0.08 },
        slate: { color: 0x8a92a0, roughness: 0.74, metalness: 0.06, bumpScale: 0.07 },
        "pearl-glaze": { color: 0xf1ece5, roughness: 0.18, metalness: 0.05, bumpScale: 0.03 },
        charcoal: { color: 0x363940, roughness: 0.78, metalness: 0.04, bumpScale: 0.08 },
        "smooth-sand": { color: 0xcbc1b0, roughness: 0.74, metalness: 0.01, bumpScale: 0.05 },
        terrazzo: { color: 0xd7d8d2, roughness: 0.66, metalness: 0.02, bumpScale: 0.12 },
        basalt: { color: 0x565e67, roughness: 0.9, metalness: 0.03, bumpScale: 0.14 },
        "weathered-concrete": { color: 0xa8adb3, roughness: 0.86, metalness: 0.02, bumpScale: 0.13 },
        "porcelain-speckle": { color: 0xf0eee8, roughness: 0.28, metalness: 0.03, bumpScale: 0.05 },
        terracotta: { color: 0xb8674a, roughness: 0.78, metalness: 0.01, bumpScale: 0.11 },
        raku: { color: 0x2f3238, roughness: 0.52, metalness: 0.08, bumpScale: 0.14 },
        "oxidized-copper": { color: 0x6c7f74, roughness: 0.5, metalness: 0.62, bumpScale: 0.1 },
        "worn-steel": { color: 0x7d858f, roughness: 0.58, metalness: 0.72, bumpScale: 0.11 },
        travertine: { color: 0xd7c6a7, roughness: 0.8, metalness: 0.01, bumpScale: 0.1 },
        "micro-cement": { color: 0xc2c6cc, roughness: 0.8, metalness: 0.02, bumpScale: 0.09 },
      };
      const cfg = presets[type] || presets.concrete;
      const texture = generateTexture(type);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3.8, 3.8);
      if (renderer && renderer.capabilities) {
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      }
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      if ("colorSpace" in texture) texture.colorSpace = THREE.SRGBColorSpace;
      else texture.encoding = THREE.sRGBEncoding;

      const material = new THREE.MeshStandardMaterial({
        color: cfg.color,
        roughness: cfg.roughness,
        metalness: cfg.metalness,
        map: texture,
        bumpMap: texture,
        bumpScale: cfg.bumpScale,
        side: THREE.DoubleSide,
      });
      return material;
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      ambient = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambient);

      const directional = new THREE.DirectionalLight(0xffffff, 0.65);
      directional.position.set(2, 4, 3);
      scene.add(directional);

      const fill = new THREE.DirectionalLight(0xffffff, 0.25);
      fill.position.set(-2, -1, -3);
      scene.add(fill);

      addAxisHelpers();

      // Two-layer grid keeps lines readable when zooming out.
      const gridSize = 2200;
      const fineGrid = new THREE.GridHelper(gridSize, 220, 0x7b93b5, 0xcfd8e5);
      fineGrid.rotation.x = Math.PI / 2;
      fineGrid.position.z = 1;
      fineGrid.frustumCulled = false;
      fineGrid.material.transparent = true;
      fineGrid.material.opacity = 0.6;
      scene.add(fineGrid);

      const coarseGrid = new THREE.GridHelper(gridSize, 44, 0x5e769a, 0x98abc4);
      coarseGrid.rotation.x = Math.PI / 2;
      coarseGrid.position.z = 1.2;
      coarseGrid.frustumCulled = false;
      coarseGrid.material.transparent = true;
      coarseGrid.material.opacity = 0.9;
      scene.add(coarseGrid);
    }

    function initRenderer() {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0xffffff, 1);
    }

    function initCamera() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 10000);
      camera.up.set(0, 0, 1);
      camera.position.set(0.7, -1.9, 0.6);
      camera.lookAt(0, 0, 0.4);

      controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.enablePan = false;
      controls.enableZoom = true;
      controls.zoomSpeed = 0.85;
      controls.rotateSpeed = 0.95;
      controls.minDistance = 0.8;
      controls.maxDistance = 6.0;
      controls.target.set(0, 0, 0.4);
      controls.update();
    }

    function resizeRenderer() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      if (controls) controls.update();
    }

    function renderScene() {
      renderer.render(scene, camera);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      renderScene();
    }

    function setModel() {
      try {
        if (modelMesh) {
          scene.remove(modelMesh);
          modelMesh.geometry.dispose();
          modelMesh.material.dispose();
        }
        const geometry = buildGeometry();
        console.log("Geometry built successfully:", geometry.attributes.position.count, "vertices");
        const material = createMaterial();
        modelMesh = new THREE.Mesh(geometry, material);
        scene.add(modelMesh);
        const box = new THREE.Box3().setFromObject(modelMesh);
        const radius = box.getBoundingSphere(new THREE.Sphere()).radius;
        const targetZ = radius * 0.4;
        const distance = radius * 2.2;
        if (controls) {
          controls.minDistance = Math.max(0.4, distance * 0.35);
          controls.maxDistance = Math.max(distance * 6.0, 2500);
          if (!hasAutoFramedModel) {
            camera.position.set(radius * 0.55, -distance, radius * 0.7);
            controls.target.set(0, 0, targetZ);
            hasAutoFramedModel = true;
          }
          controls.update();
        }
        renderScene();
      } catch (error) {
        console.error("setModel error:", error);
        previewError.textContent = `Render error: ${error.message}`;
      }
    }

    function updatePreview() {
      try {
        previewError.textContent = "";
        if (!renderer) {
          initPreview();
        } else {
          setModel();
        }
      } catch (error) {
        console.error("Preview error:", error);
        previewError.textContent = `Error: ${error?.message || "Unknown error"}`;
      }
    }

    function onWindowResize() {
      if (!renderer) return;
      resizeRenderer();
      renderScene();
    }

    function initPreview() {
      if (!renderer) {
        try {
          initRenderer();
          initCamera();
          initScene();
          resizeRenderer();
          animate();
        } catch (error) {
          console.error("Failed to init preview:", error);
          previewError.textContent = `Init failed: ${error.message}`;
          return;
        }
      }
      setModel();
    }

    let sourceVersion = null;
    async function pollSourceVersion() {
      try {
        const response = await fetch("/__version__", { cache: "no-store" });
        if (!response.ok) return;
        const payload = await response.json();
        const currentVersion = Number(payload.version);
        if (Number.isFinite(currentVersion)) {
          if (sourceVersion === null) sourceVersion = currentVersion;
          else if (currentVersion > sourceVersion + 0.1) window.location.reload(true);
        }
      } catch {
        // ignore intermittent failures while editing files
      }
    }

    for (const element of Object.values(inputs)) {
      element.addEventListener("input", updatePreview);
      element.addEventListener("change", updatePreview);
    }

    window.addEventListener("resize", onWindowResize);
    updatePreview();
    pollSourceVersion();
    setInterval(pollSourceVersion, 1800);
  </script>
</body>
</html>
